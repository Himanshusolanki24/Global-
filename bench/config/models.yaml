# Ordered smallest → largest: the frontend size dial follows this order.
# Every Ollama tag is checked against `ollama list` before a run; a missing tag fails fast.
# T4 has 15 GB usable VRAM: llama3.1 8B FP16 (~16 GB) will partly offload to CPU, which NVML cannot see.
small:
  - model: qwen2.5-0.5b
    name: Qwen2.5 0.5B
    params_b: 0.5
    tags: {Q4: "qwen2.5:0.5b-instruct-q4_K_M", Q8: "qwen2.5:0.5b-instruct-q8_0", FP16: "qwen2.5:0.5b-instruct-fp16"}
  - model: llama3.2-1b
    name: Llama 3.2 1B
    params_b: 1.2
    tags: {Q4: "llama3.2:1b-instruct-q4_K_M", Q8: "llama3.2:1b-instruct-q8_0", FP16: "llama3.2:1b-instruct-fp16"}
  - model: gemma2-2b
    name: Gemma 2 2B
    params_b: 2.6
    tags: {Q4: "gemma2:2b-instruct-q4_K_M", Q8: "gemma2:2b-instruct-q8_0", FP16: "gemma2:2b-instruct-fp16"}
  - model: phi3.5-mini
    name: Phi-3.5 mini
    params_b: 3.8
    tags: {Q4: "phi3.5:3.8b-mini-instruct-q4_K_M", Q8: "phi3.5:3.8b-mini-instruct-q8_0", FP16: "phi3.5:3.8b-mini-instruct-fp16"}
  - model: llama3.1-8b
    name: Llama 3.1 8B
    params_b: 8.0
    tags: {Q4: "llama3.1:8b-instruct-q4_K_M", Q8: "llama3.1:8b-instruct-q8_0", FP16: "llama3.1:8b-instruct-fp16"}

big:
  - {model: mistral-small, name: Mistral Small, backend: mistral, tag: mistral-small-latest}   # 24B; on the free tier (Large is not)
  - {model: claude-sonnet, name: Claude Sonnet, backend: anthropic, tag: claude-sonnet-5-5}

router:
  small: phi3.5-mini/Q4
  bigs: [llama3.1-8b/Q8, mistral-small/API]   # local big ⇒ Wh saved is measured; API big ⇒ ₹ saved is measured
  samples: 3
  conf_temperature: 0.7   # benchmark stays at 0; only the confidence samples are sampled
